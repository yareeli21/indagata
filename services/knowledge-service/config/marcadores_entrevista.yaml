# ─────────────────────────────────────────────────────────────────────────────
# Marcadores para el análisis de respuestas de entrevista SIN el modelo de lenguaje
# (respaldo de `services/documento/analisis_entrevista.py`). Comparación sin
# mayúsculas ni acentos, por palabra completa. Reinicia knowledge-service al editar.
# ─────────────────────────────────────────────────────────────────────────────

# Marco temporal de un fragmento (el primero que aparezca decide).
tiempo:
  pasado: ["cuando iba", "cuando era", "cuando estaba", "de nino", "de nina", "de pequeno", "de pequena",
           "en la primaria", "en la secundaria", "en la prepa", "antes", "en ese entonces", "solia", "hace anos",
           "el ano pasado", "al principio"]
  actual: ["ahora", "actualmente", "hoy", "hoy en dia", "en este momento", "este semestre", "ultimamente",
           "en la universidad", "ya no", "todavia"]
  hipotetico: ["si pudiera", "si tuviera", "me gustaria", "quisiera", "seria", "podria", "en el futuro"]

# Conectores que separan unidades dentro de una oración.
conectores: [", pero ", ", aunque ", ", entonces ", ", sin embargo ", " pero ahora ", ", por eso "]

# Ambivalencia: si la respuesta (o un fragmento que responde) EMPIEZA con una de estas
# frases, la postura es «ambivalente» («Depende; en matemáticas sí, en redacción no tanto»).
# Solo al inicio: «Sí, a veces voy» sigue siendo «sí». «No del todo» no está: se lee como «no».
ambivalencia: ["depende", "mas o menos", "a veces", "en parte", "segun", "ni si ni no", "hay de todo"]

# Postura explícita en un fragmento.
postura:
  "si": ["si", "claro", "por supuesto", "definitivamente", "creo que si", "diria que si", "totalmente"]
  "no": ["no", "para nada", "nunca", "creo que no", "diria que no"]

# ─────────────────────────────────────────────────────────────────────────────
# Análisis de lo que se cuenta (`services/documento/nlp_entrevista.py`, 7 nov 2026).
# Respaldo por reglas del análisis del modelo: cada etiqueta lleva la oración literal
# que la sustenta. Raíces sin acentos; se buscan al inicio de palabra.
# ─────────────────────────────────────────────────────────────────────────────

# Actores que la persona menciona (categoría: raíces).
actores:
  profesores: ["profesor", "profesora", "profe", "maestro", "maestra", "docente"]
  tutor: ["tutor", "tutora", "asesor", "asesora"]
  servicios de apoyo: ["orientacion", "orientador", "orientadora", "psicolog", "consultorio", "terapia", "terapeuta",
                       "servicio", "enfermeria", "becas"]
  institucion: ["universidad", "escuela", "institucion", "coordinacion", "direccion", "administracion"]
  companeros: ["companero", "companera", "amigo", "amiga", "grupo"]
  familia: ["familia", "mama", "papa", "padres", "madre", "padre", "hermano", "hermana", "pareja"]
  trabajo: ["trabajo", "jefe", "empleo"]

# Valoración: palabras que inclinan una oración (se cuentan; gana la que tenga más).
valoracion:
  positivo: ["amable", "bien", "buena", "bueno", "ayudo", "ayuda mucho", "me sirvio", "util", "mejor", "tranquila",
             "tranquilo", "comoda", "comodo", "contenta", "contento", "gusto", "excelente", "apoyo", "logre"]
  negativo: ["mal", "pesado", "pesada", "estres", "ansiedad", "cansada", "cansado", "dificil", "pena", "miedo",
             "verguenza", "no me gusto", "insuficiente", "poquito", "tarde", "tardaron", "nadie", "solo hay",
             "falta", "presion", "agobi", "triste", "frustr", "peor"]

# Oraciones que expresan una barrera, una propuesta o una experiencia vivida.
barreras: ["me daba pena", "no sabia", "no sabe", "no tenia tiempo", "no tengo tiempo", "miedo", "verguenza",
           "no hay", "solo hay", "tardaron", "tarda", "lejos", "no me atrevia", "juzgad", "no era tan grave",
           "lista de espera", "no alcanza", "dificil"]
propuestas: ["que hubiera", "que haya", "deberian", "deberia", "me gustaria", "propondria", "cambiaria",
             "seria bueno", "seria mejor", "hace falta", "estaria bien", "que no espere", "que pidan", "que busque"]
experiencias: ["fui", "tuve", "me paso", "me atendieron", "empece", "me dijeron", "me recomendo", "pedi", "acudi",
               "me ayudo", "me senti", "estuve"]
